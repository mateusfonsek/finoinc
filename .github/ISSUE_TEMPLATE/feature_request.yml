name: Feature request
description: Suggest something the app should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and why the app gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you imagine it working. Rough is fine.
  - type: checkboxes
    id: local
    attributes:
      label: Local-first
      options:
        - label: This works without sending data off the Mac, or the network part is opt-in.
