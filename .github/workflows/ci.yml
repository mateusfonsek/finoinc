name: ci

on:
  pull_request:
    # `edited` is mandatory: this gate validates the PR TITLE, and a title
    # change only produces that event type. Without it, someone whose title was
    # rejected fixes it and nothing happens — the check stays red until they
    # push some commit or close/reopen the PR, with no hint as to why.
    types: [opened, synchronize, reopened, edited]

# A new push makes the previous run irrelevant. Without this, every push to an
# open PR piles up a full macOS suite running in parallel.
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

# These jobs run pnpm lifecycle scripts and cargo build scripts — third-party
# code. Read only, nothing else.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  commit-format:
    # Ubuntu here: it is only git + grep, macOS is not needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needs the history to compare base..head.
          fetch-depth: 0

      - name: Validate PR title and commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # `pipefail` is what holds this gate up: the Actions default shell
          # is `bash -e {0}`, and in a pipeline without pipefail only the LAST
          # command's status counts. If `git log` fails (force-pushed base,
          # unreachable SHA, shallow clone), the script gets empty stdin,
          # validates only PR_TITLE and exits 0 — the step goes green with the
          # per-commit half of the gate never having run, which is exactly the
          # silent failure this job exists to prevent.
          set -euo pipefail

          git log --format=%s "$BASE_SHA..$HEAD_SHA" \
            | .github/scripts/check-commit-format.sh
