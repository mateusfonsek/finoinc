name: release

# Fires on merge to main. The tag is NO LONGER the trigger — it becomes a
# consequence: the workflow computes the version, builds and creates the tag.
on:
  push:
    branches: [main]

# Two merges in a row must not run over each other: the second needs to see the
# tag the first created in order to compute the right bump.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: `git describe` needs the tags.
          fetch-depth: 0

      - name: Compute the next version
        id: version
        run: |
          # `pipefail`: the Actions default shell is `bash -e {0}`, and without
          # pipefail a pipeline's status is only the last command's. If the
          # `git log` below fails (unreachable SHA, shallow clone),
          # next-version.sh gets EMPTY input, concludes "nothing releasable" and
          # exits 0 — the merge would slip by with no release and no error.
          set -euo pipefail

          # A later merge has its own run queued behind this one, and that run
          # releases these commits too. Releasing here would only lose the
          # race to push onto a main that moved, so step aside.
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on to ${latest:0:7}; its own run releases these commits."
            echo "next=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(node -p "require('./package.json').version")
          last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$last_tag" ]; then range="$last_tag..HEAD"; else range=HEAD; fi

          # %x00 separates the commits: the script treats only the FIRST line
          # of each record as the header. With plain `--format=%B`, a body line
          # such as "fix: ..." in a `chore:` commit would become a patch release.
          next=$(git log --format='%B%x00' "$range" | .github/scripts/next-version.sh "$current")

          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"

          if [ -z "$next" ]; then
            echo "No releasable commit since ${last_tag:-the start of the repo}."
            echo "Ending without a release — the expected behavior for"
            echo "docs/chore/test/ci/refactor merges."
          else
            echo "Version: $current → $next"
          fi

      - name: Check the tag does not exist yet
        if: steps.version.outputs.next != ''
        run: |
          if git rev-parse "v${{ steps.version.outputs.next }}" >/dev/null 2>&1; then
            echo "::error::tag v${{ steps.version.outputs.next }} already exists"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.next != ''
        with:
          version: 11

      - uses: actions/setup-node@v4
        if: steps.version.outputs.next != ''
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.next != ''
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.next != ''
        with:
          workspaces: src-tauri

      - name: Install dependencies
        if: steps.version.outputs.next != ''
        run: pnpm install --frozen-lockfile

      # The ORDER from here down is not interchangeable: Tauri bakes the
      # tauri.conf.json version into the bundle, so building before the bump
      # would produce a .dmg stamped with the old version. And committing before
      # the build would leave main with a version that never became a release if
      # the build broke. Bump the working tree → build → only then commit.
      - name: Write the version into the files
        if: steps.version.outputs.next != ''
        run: .github/scripts/set-version.sh "${{ steps.version.outputs.next }}"

      - name: Build universal (Apple Silicon + Intel)
        if: steps.version.outputs.next != ''
        run: pnpm tauri build --target universal-apple-darwin

      - name: Commit, tag and push
        id: push
        if: steps.version.outputs.next != ''
        run: |
          set -euo pipefail

          # Same reason as the check before the build: main can move during the
          # ~10 minutes of it, and then the newer run takes over.
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on to ${latest:0:7} during the build; its own run releases these commits."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): v${{ steps.version.outputs.next }} [skip ci]"

          # Two invariants protect this block, and both must hold if anyone
          # touches it:
          #
          # 1. `git tag -a` (ANNOTATED), not lightweight. A lightweight tag
          #    (`git tag v1.2.3`) is simply IGNORED by `--follow-tags` — only
          #    annotated tags travel with it. This was a bug here once already.
          #
          # 2. Pushing the commit and pushing the tag must be ONE atomic push
          #    (`--atomic`, two refs), not two separate `git push` calls. With
          #    two pushes, the first (the commit on HEAD:main) can land and the
          #    second (the tag) fail — network, permissions, whatever. The `gh
          #    release create` just below even hides the damage by creating the
          #    missing tag, but at the default branch's tip, not on this commit.
          #    And if `gh` fails too, main is left with a `chore(release):` and
          #    no tag at all: the next run recomputes the SAME version, builds
          #    again (~10min of macOS runner) and dies at `git commit` (nothing
          #    staged to commit), requiring a manual fix. `--atomic` makes both
          #    refs move together or neither move — with no intermediate
          #    "commit landed, tag did not" state. Everything else in the flow —
          #    the `git describe` in the version calculation, the "tag already
          #    exists" guard, the loop prevention — assumes the tag was created
          #    HERE, alongside the commit.
          git tag -a "v${{ steps.version.outputs.next }}" -m "v${{ steps.version.outputs.next }}"
          git push --atomic origin HEAD:main "refs/tags/v${{ steps.version.outputs.next }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `pipefail` because the Actions default shell is `bash -e {0}`,
          # WITHOUT it: in a pipeline, the status that counts is the LAST
          # command's. Without pipefail, a failing `git log` (or a .dmg glob
          # that does not match) is swallowed by `head`/the next script, the
          # variable comes out empty and `set -e` never fires — the failure only
          # resurfaces at `gh`, with a message that does not point at the cause.
          set -euo pipefail

          # `ls *.dmg | head -1` under `pipefail` protects nothing: when the
          # glob does not match, it is the ASSIGNMENT that fails ("ls: ... No
          # such file or directory"), `set -e` kills the step right there and
          # `[ ! -f ]` never even runs — the `::error::` below never appears,
          # only the raw `ls` error. On top of that, `ls | head -1` can exit 141
          # (SIGPIPE) if the listing is large enough to overflow the pipe
          # buffer. A glob array solves both: an empty expansion becomes an
          # empty array (with `nullglob`; without it the literal `*.dmg` pattern
          # would linger as a "file"), testable in pure shell, with no subshell
          # and no pipe.
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::no .dmg found in src-tauri/target/universal-apple-darwin/release/bundle/dmg/ — the Tauri build did not produce the expected bundle"
            exit 1
          fi
          if [ ${#dmgs[@]} -gt 1 ]; then
            # Unexpected (Tauri's bundler produces a single universal .dmg):
            # warn instead of choosing silently.
            echo "warning: ${#dmgs[@]} .dmg files found, using the first: ${dmgs[0]}"
          fi
          dmg="${dmgs[0]}"
          echo "Attaching: $dmg"

          # The .dmg only. The .tar.gz the tauri-action used to attach (and
          # which was deleted by hand) is simply never uploaded.
          git log --format=%s "${{ steps.version.outputs.range }}" \
            | .github/scripts/release-notes.sh > /tmp/notes.md

          gh release create "v${{ steps.version.outputs.next }}" \
            --title "Finoinc v${{ steps.version.outputs.next }}" \
            --notes-file /tmp/notes.md \
            "$dmg"
