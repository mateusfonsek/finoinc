name: release

# Fires on merge to main. The tag is NO LONGER the trigger — it becomes a
# consequence: the workflow computes the version, builds and creates the tag.
on:
  push:
    branches: [main]

# Two merges in a row must not run over each other: the second needs to see the
# tag the first created in order to compute the right bump.
concurrency:
  group: release-main
  cancel-in-progress: false

# Read only by default; only `publish` writes (commit, tag, release).
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Decides whether this merge releases, and as what. Runs once, so every
  # platform build below stamps the same version.
  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.version.outputs.next }}
      range: ${{ steps.version.outputs.range }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: `git describe` needs the tags.
          fetch-depth: 0

      - name: Compute the next version
        id: version
        run: |
          # `pipefail`: the Actions default shell is `bash -e {0}`, and without
          # pipefail a pipeline's status is only the last command's. If the
          # `git log` below fails (unreachable SHA, shallow clone),
          # next-version.sh gets EMPTY input, concludes "nothing releasable" and
          # exits 0 — the merge would slip by with no release and no error.
          set -euo pipefail

          # A later merge has its own run queued behind this one, and that run
          # releases these commits too. Releasing here would only lose the
          # race to push onto a main that moved, so step aside.
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on to ${latest:0:7}; its own run releases these commits."
            echo "next=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(node -p "require('./package.json').version")
          last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$last_tag" ]; then range="$last_tag..HEAD"; else range=HEAD; fi

          # %x00 separates the commits: the script treats only the FIRST line
          # of each record as the header. With plain `--format=%B`, a body line
          # such as "fix: ..." in a `chore:` commit would become a patch release.
          next=$(git log --format='%B%x00' "$range" | .github/scripts/next-version.sh "$current")

          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"

          if [ -z "$next" ]; then
            echo "No releasable commit since ${last_tag:-the start of the repo}."
            echo "Ending without a release — the expected behavior for"
            echo "docs/chore/test/ci/refactor merges."
          else
            echo "Version: $current → $next"
          fi

      - name: Check the tag does not exist yet
        if: steps.version.outputs.next != ''
        run: |
          if git rev-parse "v${{ steps.version.outputs.next }}" >/dev/null 2>&1; then
            echo "::error::tag v${{ steps.version.outputs.next }} already exists"
            exit 1
          fi

  # One build per OS. Each writes the version into ITS working tree only:
  # Tauri bakes the tauri.conf.json version into the bundle, so building before
  # the bump would stamp the old version. Nothing is committed here — if any
  # platform fails, `publish` never runs and main keeps no version that never
  # became a release.
  build:
    needs: version
    if: needs.version.outputs.next != ''
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: windows
            args: ""
            rust_targets: ""
          # 22.04, not latest: an AppImage only runs on distributions whose
          # glibc is at least as new as the one it was built against.
          - os: ubuntu-22.04
            name: linux
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write the version into the files
        run: .github/scripts/set-version.sh "${{ needs.version.outputs.next }}"

      # Every build signs its updater package (`createUpdaterArtifacts`); an
      # installed app refuses any update whose signature its public key does
      # not verify. Without the secrets the build fails here, before anything
      # is committed or published.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ matrix.args }}

      - name: Collect the packages
        run: |
          set -euo pipefail
          # A glob array, not `ls | head`: with `nullglob` an empty match is an
          # empty array, testable without a subshell or a pipe that could fail
          # on its own (see the publish job).
          shopt -s nullglob
          v="${{ needs.version.outputs.next }}"
          mkdir -p out
          case "${{ matrix.name }}" in
            macos)
              bundle=src-tauri/target/universal-apple-darwin/release/bundle
              files=("$bundle"/dmg/*.dmg)
              # The updater's package for macOS is the zipped .app, named
              # Finoinc.app.tar.gz by Tauri; versioned here so release assets
              # never collide and latest-json.sh can find it by name.
              if [ -f "$bundle/macos/Finoinc.app.tar.gz" ]; then
                cp "$bundle/macos/Finoinc.app.tar.gz" "out/Finoinc_${v}_universal.app.tar.gz"
                cp "$bundle/macos/Finoinc.app.tar.gz.sig" "out/Finoinc_${v}_universal.app.tar.gz.sig"
              fi
              ;;
            windows) files=(src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.exe.sig) ;;
            linux) files=(src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/appimage/*.AppImage.sig src-tauri/target/release/bundle/deb/*.deb) ;;
          esac
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::the ${{ matrix.name }} build produced no package"
            exit 1
          fi
          cp "${files[@]}" out/
          ls -l out

      - name: Check "Open with Finoinc" in the .deb
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Tauri's stock desktop entry has neither a file placeholder nor a
          # MIME type, and then the file manager never offers Finoinc for an
          # .ofx (src-tauri/linux/ has the template and the type).
          dir=$(mktemp -d)
          dpkg-deb -x out/*.deb "$dir"
          cat "$dir"/usr/share/applications/*.desktop
          grep -q '^Exec=.* %F$' "$dir"/usr/share/applications/*.desktop
          grep -q '^MimeType=application/x-ofx' "$dir"/usr/share/applications/*.desktop
          test -f "$dir"/usr/share/mime/packages/finoinc.xml

      - uses: actions/upload-artifact@v4
        with:
          name: finoinc-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  # Runs only when EVERY platform built: this is where the version becomes
  # real (commit + tag) and the release is created with all packages.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: finoinc-*
          merge-multiple: true

      - name: Commit, tag and push
        id: push
        run: |
          set -euo pipefail

          # Same reason as the check in `version`: main can move during the
          # builds, and then the newer run takes over.
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on to ${latest:0:7} during the build; its own run releases these commits."
            exit 0
          fi

          # Rewrites the same files each build did (Cargo.lock included, via
          # cargo metadata), so the commit matches what was shipped.
          .github/scripts/set-version.sh "${{ needs.version.outputs.next }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): v${{ needs.version.outputs.next }} [skip ci]"

          # Two invariants protect this block, and both must hold if anyone
          # touches it:
          #
          # 1. `git tag -a` (ANNOTATED), not lightweight. A lightweight tag
          #    (`git tag v1.2.3`) is simply IGNORED by `--follow-tags` — only
          #    annotated tags travel with it. This was a bug here once already.
          #
          # 2. Pushing the commit and pushing the tag must be ONE atomic push
          #    (`--atomic`, two refs), not two separate `git push` calls. With
          #    two pushes, the first (the commit on HEAD:main) can land and the
          #    second (the tag) fail — network, permissions, whatever. The `gh
          #    release create` just below even hides the damage by creating the
          #    missing tag, but at the default branch's tip, not on this commit.
          #    And if `gh` fails too, main is left with a `chore(release):` and
          #    no tag at all: the next run recomputes the SAME version, builds
          #    every platform again and dies at `git commit` (nothing
          #    staged to commit), requiring a manual fix. `--atomic` makes both
          #    refs move together or neither move — with no intermediate
          #    "commit landed, tag did not" state. Everything else in the flow —
          #    the `git describe` in the version calculation, the "tag already
          #    exists" guard, the loop prevention — assumes the tag was created
          #    HERE, alongside the commit.
          git tag -a "v${{ needs.version.outputs.next }}" -m "v${{ needs.version.outputs.next }}"
          git push --atomic origin HEAD:main "refs/tags/v${{ needs.version.outputs.next }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `pipefail` because the Actions default shell is `bash -e {0}`,
          # WITHOUT it: in a pipeline, the status that counts is the LAST
          # command's. Without pipefail, a failing `git log` (or a .dmg glob
          # that does not match) is swallowed by `head`/the next script, the
          # variable comes out empty and `set -e` never fires — the failure only
          # resurfaces at `gh`, with a message that does not point at the cause.
          set -euo pipefail

          # `ls *.dmg | head -1` under `pipefail` protects nothing: when the
          # glob does not match, it is the ASSIGNMENT that fails ("ls: ... No
          # such file or directory"), `set -e` kills the step right there and
          # `[ ! -f ]` never even runs — the `::error::` below never appears,
          # only the raw `ls` error. On top of that, `ls | head -1` can exit 141
          # (SIGPIPE) if the listing is large enough to overflow the pipe
          # buffer. A glob array solves both: an empty expansion becomes an
          # empty array (with `nullglob`; without it the literal `*.dmg` pattern
          # would linger as a "file"), testable in pure shell, with no subshell
          # and no pipe.
          shopt -s nullglob
          # One package per kind is expected; a missing kind means a build
          # changed its output, so the release stops instead of shipping less.
          # The updater manifest; fails when any platform's package or
          # signature is missing, so no OS is silently left without updates.
          .github/scripts/latest-json.sh "${{ needs.version.outputs.next }}" packages > packages/latest.json

          files=()
          for kind in dmg exe AppImage deb app.tar.gz sig json; do
            found=(packages/*."$kind")
            if [ ${#found[@]} -eq 0 ]; then
              echo "::error::no .$kind among the built packages"
              exit 1
            fi
            files+=("${found[@]}")
          done
          printf 'Attaching: %s\n' "${files[@]}"

          git log --format=%s "${{ needs.version.outputs.range }}" \
            | .github/scripts/release-notes.sh > "$RUNNER_TEMP/notes.md"

          gh release create "v${{ needs.version.outputs.next }}" \
            --title "Finoinc v${{ needs.version.outputs.next }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${files[@]}"

  # Points the Homebrew cask at the new .dmg. A separate job so a tap problem
  # never touches the release, which is already out by now; with no token it
  # only warns.
  homebrew:
    needs: [version, publish]
    if: needs.publish.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      NEXT: ${{ needs.version.outputs.next }}
    steps:
      - name: No token
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew cask was not updated."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          sparse-checkout: .github
          path: finoinc

      - uses: actions/download-artifact@v4
        if: env.HAS_TOKEN == 'true'
        with:
          name: finoinc-macos
          path: mac

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          repository: mateusfonsek/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the cask
        if: env.HAS_TOKEN == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(mac/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "::error::expected one .dmg in the macOS artifact, found ${#dmgs[@]}"
            exit 1
          fi
          sha=$(sha256sum "${dmgs[0]}" | cut -d' ' -f1)
          mkdir -p tap/Casks
          finoinc/.github/scripts/render-cask.sh "$NEXT" "$sha" finoinc/.github/homebrew/finoinc.rb \
            > tap/Casks/finoinc.rb

          cd tap
          git add Casks/finoinc.rb
          if git diff --cached --quiet; then
            echo "The cask is already at $NEXT."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "finoinc $NEXT"
          git push
